<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style>
      .bg-js { fill: #f7df1e; }
      .bg-cl { fill: #5881d8; }
      .text { 
        fill: #000000;
        font-family: 'Arial', 'Helvetica', sans-serif;
        font-weight: bold;
        font-size: 56px;
        text-anchor: middle;
        dominant-baseline: central;
      }
    </style>
  </defs>
  
  <!-- Background blocks -->
  <rect x="0" y="0" width="100" height="100" class="bg-js"/>
  <rect x="100" y="0" width="100" height="100" class="bg-js"/>
  <rect x="0" y="100" width="100" height="100" class="bg-cl"/>
  <rect x="100" y="100" width="100" height="100" class="bg-cl"/>
  
  <!-- Text -->
  <text x="50" y="50" class="text">J</text>
  <text x="150" y="50" class="text">S</text>
  <text x="50" y="150" class="text" style="fill: #ffffff;">C</text>
  <text x="150" y="150" class="text" style="fill: #ffffff;">L</text>
</svg>
